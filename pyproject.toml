[project]
name = "crocolaketools"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
]
dependencies = [
    "argopy==1.3.1",
    "bokeh==3.4.2",
    "crocolakeloader",
    "dask[dataframe]==2024.7.1",
    "distributed==2024.7.1",
    "gsw==3.6.19",
    "h5netcdf==1.8.1",
    "h5py==3.16.0",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "psutil==5.9.8",
    "pyarrow==22.0.0",
    "pytest==9.1.1",
    "pytest-socket==0.8.1",
    "pyyaml==6.0.3",
    "requests>=2.34.2",
    "scipy==1.13.1",
    "tqdm==4.70.0",
    "urllib3==1.26.6",
    "xarray==2025.7.0",
    "yq==4.1.2",
]
requires-python = ">=3.11,<3.12"

[project.scripts]
download_demo_data = "scripts.download_demo_data:main"


[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --durations=10"

[tool.uv.build-backend]
module-root = ""
module-name = ["crocolaketools", "scripts"]

[tool.uv.sources]
crocolakeloader = { path = "crocolakeloader", editable = true}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


